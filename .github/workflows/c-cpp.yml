name: Windows CMake MSVC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.31.6"

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        vs-version: '2022'

    - name: Configure CMake Debug
      run: |
        cmake -B build-Debug -S . `
          -G "Ninja" -DCMAKE_BUILD_TYPE=Debug
    - name: Build project Debug
      run: cmake --build build-Debug --config Debug

    - name: Run tests with CTest Debug
      run: ctest --test-dir build-Debug --build-config Debug --output-on-failure

    - name: Configure CMake Release
      run: |
        cmake -B build-Release -S . `
          -G "Ninja" -DCMAKE_BUILD_TYPE=Release
    - name: Build project Release
      run: cmake --build build-Release --config Release

    - name: Run tests with CTest Release
      run: ctest --test-dir build-Release --build-config Release --output-on-failure

