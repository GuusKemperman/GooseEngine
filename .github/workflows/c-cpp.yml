name: Windows CMake MSVC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug]
    env:
      BUILD_DIR: build-${{ matrix.config }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.31.6"

    - name: Install Ninja
      run: choco install ninja -y  # Or use lukka/get-cmake action

    - name: Configure CMake
      run: |
        cmake -B $env:BUILD_DIR -S . `
          -G "Ninja" `
          -DCMAKE_CXX_COMPILER=cl.exe `
          -DCMAKE_C_COMPILER=cl.exe `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug> `
          -DBUILD_TESTING=ON

    - name: Build project
      run: cmake --build $env:BUILD_DIR --config ${{ matrix.config }}

    - name: Run tests with CTest
      run: ctest --test-dir $env:BUILD_DIR --build-config ${{ matrix.config }} --output-on-failure
