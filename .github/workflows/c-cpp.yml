name: Windows CMake MSVC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]
    env:
      BUILD_DIR: build-${{ matrix.config }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.31.6"

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        vs-version: '2022'

    - name: Configure CMake
      run: |
        cmake -B $env:BUILD_DIR -S . `
          -G "Ninja" 

    - name: Build project
      run: cmake --build $env:BUILD_DIR --config ${{ matrix.config }}

    - name: Run tests with CTest
      run: ctest --test-dir $env:BUILD_DIR --build-config ${{ matrix.config }} --output-on-failure
